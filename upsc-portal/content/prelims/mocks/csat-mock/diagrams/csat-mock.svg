<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">CSAT Mock — Test Anatomy</text>
  <text x="30" y="54" class="s">prelims · block → plan</text>
  <rect x="30" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">PAPER FACTS</text>
  <text x="44" y="134" class="md">actual: 80 Q · 2 hr · 200 marks</text>
  <text x="44" y="151" class="md">this drill: 30 Q · 45 min</text>
  <text x="44" y="168" class="md">negative: −0.83 per wrong</text>
  <text x="44" y="185" class="md">qualifying: 33% (66 marks)</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">ATTEMPT ORDER</text>
  <text x="502" y="134" class="md">round 1: syllogism-quant sprints</text>
  <text x="502" y="151" class="md">round 2: RC passages</text>
  <text x="502" y="168" class="md">round 3: return skips</text>
  <text x="502" y="185" class="md">never marathon one puzzle</text>
  <rect x="30" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="252" class="h">TIME BUDGET</text>
  <text x="44" y="272" class="md">~90 sec per question</text>
  <text x="44" y="289" class="md">skip at 2 min flat</text>
  <text x="44" y="306" class="md">guard last 10 min for review</text>
  <text x="44" y="323" class="md">accuracy target: 85%+</text>
  <rect x="488" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="252" class="h">ANALYSIS</text>
  <text x="502" y="272" class="md">log: trap-misread-gap-speed</text>
  <text x="502" y="289" class="md">re-solve every wrong Q</text>
  <text x="502" y="306" class="md">re-attempt after a week</text>
  <text x="502" y="323" class="md">track score trend, not single</text>
  <text x="30" y="402" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>