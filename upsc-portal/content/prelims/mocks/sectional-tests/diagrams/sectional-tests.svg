<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Sectional Tests — Usage Map</text>
  <text x="30" y="54" class="s">prelims · section → rule</text>
  <rect x="30" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">THE SIX</text>
  <text x="44" y="134" class="md">history-culture 20Q</text>
  <text x="44" y="151" class="md">polity 20Q</text>
  <text x="44" y="168" class="md">geography 20Q</text>
  <text x="44" y="185" class="md">economy · environment · science-tech 20Q each</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">WHEN</text>
  <text x="502" y="134" class="md">right after topic completion</text>
  <text x="502" y="151" class="md">not before first revision</text>
  <text x="502" y="168" class="md">1-2 sectionals per week</text>
  <text x="502" y="185" class="md">mocks last: build-up order</text>
  <rect x="30" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="252" class="h">SCORE BANDS</text>
  <text x="44" y="272" class="md">60%+ → move on</text>
  <text x="44" y="289" class="md">40-60% → targeted revision</text>
  <text x="44" y="306" class="md">below 40% → redo notes+PYQs</text>
  <text x="44" y="323" class="md">negative marks counted</text>
  <rect x="488" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="252" class="h">ERROR LOG</text>
  <text x="502" y="272" class="md">factual gap → notes page</text>
  <text x="502" y="289" class="md">trap → trap-flash list</text>
  <text x="502" y="306" class="md">misread → question-scan habit</text>
  <text x="502" y="323" class="md">time → skip discipline</text>
  <text x="30" y="402" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>