<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Comprehension Attack Grid</text>
  <text x="30" y="54" class="s">prelims · step → action</text>
  <rect x="30" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">STEP 1 — SCAN</text>
  <text x="44" y="134" class="md">read questions first</text>
  <text x="44" y="151" class="md">mark: fact-inference-tone-vocab</text>
  <text x="44" y="168" class="md">note option-type (all-1/2/3 pairs)</text>
  <text x="44" y="185" class="md">budget: ~90 sec per question</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">STEP 2 — READ</text>
  <text x="502" y="134" class="md">topic + concluding sentence first</text>
  <text x="502" y="151" class="md">paragraph = one idea (topic line)</text>
  <text x="502" y="168" class="md">watch contrast words: but-however</text>
  <text x="502" y="185" class="md">watch qualifiers: only-most-may</text>
  <rect x="30" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="252" class="h">STEP 3 — ELIMINATE</text>
  <text x="44" y="272" class="md">extreme options usually wrong</text>
  <text x="44" y="289" class="md">outside-scope = trap</text>
  <text x="44" y="306" class="md">fact ≠ opinion ≠ inference</text>
  <text x="44" y="323" class="md">pick least-wrong when stuck</text>
  <rect x="488" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="252" class="h">TRAP TYPES</text>
  <text x="502" y="272" class="md">reversal of claim</text>
  <text x="502" y="289" class="md">sweeping generalisation</text>
  <text x="502" y="306" class="md">new-fact injection</text>
  <text x="502" y="323" class="md">right-idea-wrong-extent</text>
  <text x="30" y="402" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>