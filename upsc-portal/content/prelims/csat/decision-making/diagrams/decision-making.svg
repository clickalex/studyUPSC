<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Decision-Making Framework</text>
  <text x="30" y="54" class="s">prelims · lens → test</text>
  <rect x="30" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">FRAME</text>
  <text x="44" y="134" class="md">identify stakeholders first</text>
  <text x="44" y="151" class="md">define the core dilemma</text>
  <text x="44" y="168" class="md">list options (usually 4)</text>
  <text x="44" y="185" class="md">ask: who is helped-harmed</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">OPTION RANK</text>
  <text x="502" y="134" class="md">legality → effectiveness</text>
  <text x="502" y="151" class="md">fairness → feasibility</text>
  <text x="502" y="168" class="md">immediacy vs root-cause</text>
  <text x="502" y="185" class="md">communication completeness</text>
  <rect x="30" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="252" class="h">HEURISTICS</text>
  <text x="44" y="272" class="md">prefer lawful + proportionate</text>
  <text x="44" y="289" class="md">avoid passive-ignoring options</text>
  <text x="44" y="306" class="md">avoid utopian-overnight fixes</text>
  <text x="44" y="323" class="md">escalate after local attempt</text>
  <rect x="488" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="252" class="h">TRAPS</text>
  <text x="502" y="272" class="md">illegally effective = wrong</text>
  <text x="502" y="289" class="md">feel-good but no action</text>
  <text x="502" y="306" class="md">secrecy without reason</text>
  <text x="502" y="323" class="md">punitive-first when coaching works</text>
  <text x="30" y="402" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>