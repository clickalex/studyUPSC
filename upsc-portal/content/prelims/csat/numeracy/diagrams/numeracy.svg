<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Numeracy Toolkit</text>
  <text x="30" y="54" class="s">prelims · topic → shortcut</text>
  <rect x="30" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">PERCENT-RATIO</text>
  <text x="44" y="134" class="md">x% of y = y% of x</text>
  <text x="44" y="151" class="md">successive: a+b+ab/100</text>
  <text x="44" y="168" class="md">fraction-percent table 1/8=12.5</text>
  <text x="44" y="185" class="md">ratio divide: income-expenditure</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">PROFIT-INTEREST</text>
  <text x="502" y="134" class="md">SP/CP ratio method</text>
  <text x="502" y="151" class="md">SI: linear, CI: compounding</text>
  <text x="502" y="168" class="md">2 yrs CI-SI diff = P(r/100)^2</text>
  <text x="502" y="185" class="md">discount on MP, profit on CP</text>
  <rect x="30" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="252" class="h">TSD-WORK</text>
  <text x="44" y="272" class="md">speed up x → time /x</text>
  <text x="44" y="289" class="md">average speed = 2ab/(a+b)</text>
  <text x="44" y="306" class="md">work: LCM method pipes</text>
  <text x="44" y="323" class="md">efficiency = 1/time</text>
  <rect x="488" y="226" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="252" class="h">DI-PROBABILITY</text>
  <text x="502" y="272" class="md">read title-units first</text>
  <text x="502" y="289" class="md">percentage-change shortcuts</text>
  <text x="502" y="306" class="md">P = favourable/total</text>
  <text x="502" y="323" class="md">at least one = 1 − none</text>
  <text x="30" y="402" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>