<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="450" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Fundamental Rights (Part III, Arts 12-35) — six rights</text>
  <text x="30" y="54" class="s">prelims · right → articles → hooks</text>
  <rect x="30" y="88" width="289" height="139" rx="10" class="card"/>
  <text x="44" y="114" class="h">14-18: EQUALITY</text>
  <text x="44" y="134" class="md">Equality before law</text>
  <text x="44" y="151" class="md">no discrimination, equal opportunity</text>
  <text x="44" y="168" class="md">untouchability &amp; titles abolished</text>
  <rect x="335" y="88" width="289" height="139" rx="10" class="card"/>
  <text x="349" y="114" class="h">19-22: FREEDOM</text>
  <text x="349" y="134" class="md">19: six freedoms</text>
  <text x="349" y="151" class="md">20: conviction protection</text>
  <text x="349" y="168" class="md">21: life+liberty, privacy (Puttaswamy)</text>
  <text x="349" y="185" class="md">21A: education (86th Amdt)</text>
  <text x="349" y="202" class="md">22: arrest safeguards</text>
  <rect x="641" y="88" width="289" height="139" rx="10" class="card"/>
  <text x="655" y="114" class="h">23-24: EXPLOITATION</text>
  <text x="655" y="134" class="md">traffic, begar, forced labour</text>
  <text x="655" y="151" class="md">child labour ban below 14</text>
  <rect x="30" y="243" width="289" height="139" rx="10" class="card"/>
  <text x="44" y="269" class="h">25-28: RELIGION</text>
  <text x="44" y="289" class="md">conscience, practise, propagate</text>
  <text x="44" y="306" class="md">denominational institutions</text>
  <text x="44" y="323" class="md">no religious instruction (aided)</text>
  <rect x="335" y="243" width="289" height="139" rx="10" class="card"/>
  <text x="349" y="269" class="h">29-30: CULTURE &amp; EDU</text>
  <text x="349" y="289" class="md">minorities: language/script</text>
  <text x="349" y="306" class="md">establish institutions</text>
  <rect x="641" y="243" width="289" height="139" rx="10" class="card"/>
  <text x="655" y="269" class="h">32: REMEDIES</text>
  <text x="655" y="289" class="md">heart and soul (Ambedkar)</text>
  <text x="655" y="306" class="md">5 writs: habeas, mandamus, prohibition, certiorari, quo-warranto</text>
  <text x="30" y="436" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>