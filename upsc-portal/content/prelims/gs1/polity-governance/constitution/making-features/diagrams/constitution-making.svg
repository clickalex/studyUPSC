<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .e{font-size:12.5px;fill:#0f172a;font-weight:700}
    .d{font-size:10.5px;fill:#475569}
    .ax{stroke:#cbd5e1;stroke-width:3}
    .ln{stroke:#94a3b8;stroke-width:1.5}
    .dot{fill:#f59e0b}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="260" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Making of the Constitution 1946-1950</text>
  <text x="30" y="54" class="s">prelims · date → milestone</text>
  <line x1="40" y1="150" x2="920" y2="150" class="ax"/>
  <line x1="60.0" y1="150" x2="60.0" y2="112" class="ln"/>
  <circle cx="60.0" cy="150" r="6" class="dot"/>
  <text x="60.0" y="82" text-anchor="middle" class="e">Dec 1946</text>
  <text x="60.0" y="99" text-anchor="middle" class="d">First CA sitting</text>
  <text x="60.0" y="76" text-anchor="middle" class="d">9 Dec; Sachchidananda Sinha temp</text>
  <line x1="200.0" y1="150" x2="200.0" y2="188" class="ln"/>
  <circle cx="200.0" cy="150" r="6" class="dot"/>
  <text x="200.0" y="210" text-anchor="middle" class="e">11 Dec 1946</text>
  <text x="200.0" y="227" text-anchor="middle" class="d">Rajendra Prasad</text>
  <text x="200.0" y="243" text-anchor="middle" class="d">permanent President</text>
  <line x1="340.0" y1="150" x2="340.0" y2="112" class="ln"/>
  <circle cx="340.0" cy="150" r="6" class="dot"/>
  <text x="340.0" y="82" text-anchor="middle" class="e">13 Dec 1946</text>
  <text x="340.0" y="99" text-anchor="middle" class="d">Objectives Resolution</text>
  <text x="340.0" y="76" text-anchor="middle" class="d">Nehru; adopted 22 Jan 1947</text>
  <line x1="480.0" y1="150" x2="480.0" y2="188" class="ln"/>
  <circle cx="480.0" cy="150" r="6" class="dot"/>
  <text x="480.0" y="210" text-anchor="middle" class="e">29 Aug 1947</text>
  <text x="480.0" y="227" text-anchor="middle" class="d">Drafting Committee</text>
  <text x="480.0" y="243" text-anchor="middle" class="d">Ambedkar, 7 members</text>
  <line x1="620.0" y1="150" x2="620.0" y2="112" class="ln"/>
  <circle cx="620.0" cy="150" r="6" class="dot"/>
  <text x="620.0" y="82" text-anchor="middle" class="e">26 Nov 1949</text>
  <text x="620.0" y="99" text-anchor="middle" class="d">CONSTITUTION ADOPTED</text>
  <text x="620.0" y="76" text-anchor="middle" class="d">Constitution Day</text>
  <line x1="760.0" y1="150" x2="760.0" y2="188" class="ln"/>
  <circle cx="760.0" cy="150" r="6" class="dot"/>
  <text x="760.0" y="210" text-anchor="middle" class="e">24 Jan 1950</text>
  <text x="760.0" y="227" text-anchor="middle" class="d">Last CA session</text>
  <text x="760.0" y="243" text-anchor="middle" class="d">Jana Gana Mana adopted</text>
  <line x1="900.0" y1="150" x2="900.0" y2="112" class="ln"/>
  <circle cx="900.0" cy="150" r="6" class="dot"/>
  <text x="900.0" y="82" text-anchor="middle" class="e">26 Jan 1950</text>
  <text x="900.0" y="99" text-anchor="middle" class="d">IN FORCE</text>
  <text x="900.0" y="76" text-anchor="middle" class="d">Republic Day</text>
  <text x="30" y="246" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>