  <text x="660.0" y="227" text-anchor="middle" class="d">Duties to President</text>
  <text x="660.0" y="243" text-anchor="middle" class="d">inform, submit decisions</text>
  <line x1="780.0" y1="150" x2="780.0" y2="112" class="ln"/>
