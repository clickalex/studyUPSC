  <text x="420.0" y="243" text-anchor="middle" class="d">aid &amp; advice; 42nd/44th</text>
  <line x1="540.0" y1="150" x2="540.0" y2="112" class="ln"/>
  <circle cx="540.0" cy="150" r="6" class="dot"/>
