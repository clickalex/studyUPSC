  <text x="180.0" y="227" text-anchor="middle" class="d">Executive+Pardon</text>
  <text x="180.0" y="243" text-anchor="middle" class="d">supreme command; clemency</text>
  <line x1="300.0" y1="150" x2="300.0" y2="112" class="ln"/>
  <circle cx="300.0" cy="150" r="6" class="dot"/>
