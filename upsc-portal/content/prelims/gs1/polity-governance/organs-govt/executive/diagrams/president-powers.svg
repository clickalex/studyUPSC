  <circle cx="60.0" cy="150" r="6" class="dot"/>
  <text x="60.0" y="82" text-anchor="middle" class="e">Art 52</text>
  <text x="60.0" y="99" text-anchor="middle" class="d">President</text>
  <text x="60.0" y="76" text-anchor="middle" class="d">head of state</text>
  <line x1="180.0" y1="150" x2="180.0" y2="188" class="ln"/>
