  <text x="300.0" y="99" text-anchor="middle" class="d">Impeachment</text>
  <text x="300.0" y="76" text-anchor="middle" class="d">2/3 both houses, constitutional violation</text>
  <line x1="420.0" y1="150" x2="420.0" y2="188" class="ln"/>
  <circle cx="420.0" cy="150" r="6" class="dot"/>
  <text x="420.0" y="210" text-anchor="middle" class="e">Art 74</text>
