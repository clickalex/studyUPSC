  <text x="540.0" y="99" text-anchor="middle" class="d">PM appointment</text>
  <text x="540.0" y="76" text-anchor="middle" class="d">leader of majority; oath by President</text>
  <line x1="660.0" y1="150" x2="660.0" y2="188" class="ln"/>
  <circle cx="660.0" cy="150" r="6" class="dot"/>
