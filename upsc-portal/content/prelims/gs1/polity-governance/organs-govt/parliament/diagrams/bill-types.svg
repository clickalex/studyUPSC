<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="450" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Parliament — bill types compared</text>
  <text x="30" y="54" class="s">prelims · bill type → route</text>
  <rect x="30" y="88" width="289" height="139" rx="10" class="card"/>
  <text x="44" y="114" class="h">ORDINARY BILL</text>
  <text x="44" y="134" class="md">either house origin</text>
  <text x="44" y="151" class="md">simple majority</text>
  <text x="44" y="168" class="md">deadlock: joint sitting (108)</text>
  <text x="44" y="185" class="md">3 readings process</text>
  <rect x="335" y="88" width="289" height="139" rx="10" class="card"/>
  <text x="349" y="114" class="h">MONEY BILL (110)</text>
  <text x="349" y="134" class="md">only LS origin</text>
  <text x="349" y="151" class="md">prior President recommendation</text>
  <text x="349" y="168" class="md">RS: 14 days, recommendations only</text>
  <text x="349" y="185" class="md">Speaker certifies — final</text>
  <text x="349" y="202" class="md">joint sitting NOT available</text>
  <rect x="641" y="88" width="289" height="139" rx="10" class="card"/>
  <text x="655" y="114" class="h">FINANCIAL BILL I</text>
  <text x="655" y="134" class="md">money matters + other content</text>
  <text x="655" y="151" class="md">either house origin</text>
  <text x="655" y="168" class="md">money clauses need rec</text>
  <text x="655" y="185" class="md">joint sitting possible</text>
  <rect x="30" y="243" width="289" height="139" rx="10" class="card"/>
  <text x="44" y="269" class="h">FINANCIAL BILL II (117)</text>
  <text x="44" y="289" class="md">no money matters but expenditure</text>
  <text x="44" y="306" class="md">either house origin</text>
  <text x="44" y="323" class="md">President rec before introducing</text>
  <rect x="335" y="243" width="289" height="139" rx="10" class="card"/>
  <text x="349" y="269" class="h">CONSTITUTION AMENDMENT</text>
  <text x="349" y="289" class="md">special majority 368</text>
  <text x="349" y="306" class="md">some need 1/2 states ratify</text>
  <text x="349" y="323" class="md">no joint sitting</text>
  <text x="349" y="340" class="md">President must assent</text>
  <text x="30" y="436" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>