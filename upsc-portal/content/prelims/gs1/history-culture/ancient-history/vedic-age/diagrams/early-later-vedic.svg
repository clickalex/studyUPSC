<svg xmlns="http://www.w3.org/2000/svg" width="960" height="484" viewBox="0 0 960 484" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="484" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Early vs Later Vedic — the comparison card</text>
  <text x="30" y="54" class="s">prelims · the most-tested contrast in ancient India</text>
  <rect x="30" y="88" width="442" height="156" rx="10" class="card"/>
  <text x="44" y="114" class="h">EARLY VEDIC 1500-1000 BCE</text>
  <text x="44" y="134" class="md">Text: Rigveda only</text>
  <text x="44" y="151" class="md">Pastoral; cows = wealth</text>
  <text x="44" y="168" class="md">Home: Sapta-Sindhu</text>
  <text x="44" y="185" class="md">Sabha &amp; Samiti powerful</text>
  <text x="44" y="202" class="md">Gods: Indra, Varuna, Agni</text>
  <text x="44" y="219" class="md">Varna flexible (dasa varna)</text>
  <rect x="488" y="88" width="442" height="156" rx="10" class="card"/>
  <text x="502" y="114" class="h">LATER VEDIC 1000-600 BCE</text>
  <text x="502" y="134" class="md">All 4 Vedas + Brahmanas etc.</text>
  <text x="502" y="151" class="md">Farming rises; iron arrives</text>
  <text x="502" y="168" class="md">Janapadas; kingship grows</text>
  <text x="502" y="185" class="md">Rituals: rajasuya, ashvamedha</text>
  <text x="502" y="202" class="md">Gods: Prajapati, Rudra, Vishnu</text>
  <text x="502" y="219" class="md">Varna rigid; 4 ashramas set</text>
  <rect x="30" y="260" width="442" height="156" rx="10" class="card"/>
  <text x="44" y="286" class="h">TEXT LADDER</text>
  <text x="44" y="306" class="md">Samhitas → Brahmanas →</text>
  <text x="44" y="323" class="md">Aranyakas → Upanishads</text>
  <text x="44" y="340" class="md">Vedangas: 6 limbs</text>
  <text x="44" y="357" class="md">Gayatri: RV 3.62.10</text>
  <text x="44" y="374" class="md">Satapatha Brahmana = Yajur</text>
  <text x="44" y="391" class="md">Atharva = folk-magic Veda</text>
  <rect x="488" y="260" width="442" height="156" rx="10" class="card"/>
  <text x="502" y="286" class="h">MCQ TRAPS</text>
  <text x="502" y="306" class="md">Ayas = metal (iron later)</text>
  <text x="502" y="323" class="md">Gopati = cattle-lord = king</text>
  <text x="502" y="340" class="md">Godhuli = distance unit</text>
  <text x="502" y="357" class="md">Nishka = gold ornament/coin</text>
  <text x="502" y="374" class="md">Bali = voluntary tribute</text>
  <text x="502" y="391" class="md">No temples, no idols</text>
  <text x="30" y="470" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>