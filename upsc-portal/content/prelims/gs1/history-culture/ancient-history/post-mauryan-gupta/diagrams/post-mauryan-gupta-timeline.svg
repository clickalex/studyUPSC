<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .e{font-size:12.5px;fill:#0f172a;font-weight:700}
    .d{font-size:10.5px;fill:#475569}
    .ax{stroke:#cbd5e1;stroke-width:3}
    .ln{stroke:#94a3b8;stroke-width:1.5}
    .dot{fill:#f59e0b}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="260" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Post-Mauryan to Harsha — dynastic timeline</text>
  <text x="30" y="54" class="s">prelims · Sungas to Guptas: 185 BCE - 647 CE</text>
  <line x1="40" y1="150" x2="920" y2="150" class="ax"/>
  <line x1="60.0" y1="150" x2="60.0" y2="112" class="ln"/>
  <circle cx="60.0" cy="150" r="6" class="dot"/>
  <text x="60.0" y="82" text-anchor="middle" class="e">185 BCE</text>
  <text x="60.0" y="99" text-anchor="middle" class="d">Sungas</text>
  <text x="60.0" y="76" text-anchor="middle" class="d">Pushyamitra; Sanchi railing</text>
  <line x1="200.0" y1="150" x2="200.0" y2="188" class="ln"/>
  <circle cx="200.0" cy="150" r="6" class="dot"/>
  <text x="200.0" y="210" text-anchor="middle" class="e">2nd-1st c BCE</text>
  <text x="200.0" y="227" text-anchor="middle" class="d">Indo-Greeks</text>
  <text x="200.0" y="243" text-anchor="middle" class="d">Menander; Milindapanha</text>
  <line x1="340.0" y1="150" x2="340.0" y2="112" class="ln"/>
  <circle cx="340.0" cy="150" r="6" class="dot"/>
  <text x="340.0" y="82" text-anchor="middle" class="e">1st c BCE+</text>
  <text x="340.0" y="99" text-anchor="middle" class="d">Shakas</text>
  <text x="340.0" y="76" text-anchor="middle" class="d">Rudradaman; Vikram Samvat 57</text>
  <line x1="480.0" y1="150" x2="480.0" y2="188" class="ln"/>
  <circle cx="480.0" cy="150" r="6" class="dot"/>
  <text x="480.0" y="210" text-anchor="middle" class="e">1st-3rd CE</text>
  <text x="480.0" y="227" text-anchor="middle" class="d">Kushanas</text>
  <text x="480.0" y="243" text-anchor="middle" class="d">Kanishka; Gandhara art</text>
  <line x1="620.0" y1="150" x2="620.0" y2="112" class="ln"/>
  <circle cx="620.0" cy="150" r="6" class="dot"/>
  <text x="620.0" y="82" text-anchor="middle" class="e">1st-2nd CE</text>
  <text x="620.0" y="99" text-anchor="middle" class="d">Satavahanas</text>
  <text x="620.0" y="76" text-anchor="middle" class="d">Deccan; land grants begin</text>
  <line x1="760.0" y1="150" x2="760.0" y2="188" class="ln"/>
  <circle cx="760.0" cy="150" r="6" class="dot"/>
  <text x="760.0" y="210" text-anchor="middle" class="e">320-550</text>
  <text x="760.0" y="227" text-anchor="middle" class="d">Guptas</text>
  <text x="760.0" y="243" text-anchor="middle" class="d">Prayaga Prashasti; Fa-Hien</text>
  <line x1="900.0" y1="150" x2="900.0" y2="112" class="ln"/>
  <circle cx="900.0" cy="150" r="6" class="dot"/>
  <text x="900.0" y="82" text-anchor="middle" class="e">606-647</text>
  <text x="900.0" y="99" text-anchor="middle" class="d">Harsha</text>
  <text x="900.0" y="76" text-anchor="middle" class="d">Kannauj; Xuanzang</text>
  <text x="30" y="246" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
