  <rect width="960" height="554" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">The 8 Classical Dances — Sangeet Natak Akademi list</text>
  <text x="30" y="54" class="s">prelims · dance → state → signature</text>
