  <text x="44" y="151" class="md">Australia flattest-smallest</text>
  <text x="44" y="168" class="md">Antarctica: 98% ice, no permanent population</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">MOUNTAINS</text>
