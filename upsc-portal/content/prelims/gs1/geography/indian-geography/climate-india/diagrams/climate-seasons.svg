<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Indian Climate — seasons &amp; rain belts</text>
  <text x="30" y="54" class="s">prelims · season → mechanism</text>
  <rect x="30" y="88" width="289" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">WINTER (Dec-Feb)</text>
  <text x="44" y="134" class="md">NE monsoon dry over India</text>
  <text x="44" y="151" class="md">western disturbances → NW rain/snow</text>
  <text x="44" y="168" class="md">jet stream drives them</text>
  <text x="44" y="185" class="md">cold waves; frost in north</text>
  <rect x="335" y="88" width="289" height="122" rx="10" class="card"/>
  <text x="349" y="114" class="h">SUMMER (Mar-May)</text>
  <text x="349" y="134" class="md">loo heat winds</text>
  <text x="349" y="151" class="md">kalbaisakhi (Bengal-Assam)</text>
  <text x="349" y="168" class="md">mango showers (Kerala-Karnataka)</text>
  <text x="349" y="185" class="md">pre-monsoon cyclones (Bay)</text>
  <rect x="641" y="88" width="289" height="122" rx="10" class="card"/>
  <text x="655" y="114" class="h">SW MONSOON (Jun-Sep)</text>
  <text x="655" y="134" class="md">onset Kerala ~1 Jun</text>
  <text x="655" y="151" class="md">Arabian Sea + Bay branches</text>
  <text x="655" y="168" class="md">orographic: W-Ghats windward</text>
  <text x="655" y="185" class="md">breaks + monsoon trough</text>
  <rect x="30" y="226" width="289" height="122" rx="10" class="card"/>
  <text x="44" y="252" class="h">NE MONSOON (Oct-Dec)</text>
  <text x="44" y="272" class="md">retreat → Oct heat</text>
  <text x="44" y="289" class="md">TN coast main rain (leeward)</text>
  <text x="44" y="306" class="md">NEC cyclones Oct-Nov</text>
  <text x="44" y="323" class="md">Cyclone season peak Bay</text>
  <rect x="335" y="226" width="289" height="122" rx="10" class="card"/>
  <text x="349" y="252" class="h">RAIN BELTS</text>
  <text x="349" y="272" class="md">highest: Meghalaya (Mawsynram)</text>
  <text x="349" y="289" class="md">low: Ladakh-Kutch-west Rajasthan</text>
  <text x="349" y="306" class="md">rain shadow: leeward Deccan</text>
  <text x="349" y="323" class="md">Cwb pockets: Shillong</text>
  <text x="30" y="402" class="foot">studyUPSC · prelims diagram · pair with detailed-notes</text>
</svg>