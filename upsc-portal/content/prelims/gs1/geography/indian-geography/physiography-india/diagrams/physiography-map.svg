  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Physiography of India — five divisions</text>
  <text x="30" y="54" class="s">prelims · division → signature</text>
