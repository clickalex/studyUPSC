<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0f172a}
    .s{font-size:12px;fill:#64748b}
    .h{font-size:13.5px;fill:#92400e;font-weight:700}
    .md{font-size:11px;fill:#334155}
    .card{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.2}
    .foot{font-size:10px;fill:#94a3b8}
  </style>
  <rect width="960" height="416" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="34" class="t">Oceanography — currents &amp; phenomena</text>
  <text x="30" y="54" class="s">prelims · feature → hook</text>
  <rect x="30" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="44" y="114" class="h">RELIEF &amp; SALINITY</text>
  <text x="44" y="134" class="md">4 oceans; Mariana deepest</text>
  <text x="44" y="151" class="md">salinity: high 20-30° belts</text>
  <text x="44" y="168" class="md">Red Sea ~41 ppt highest</text>
  <text x="44" y="185" class="md">Baltic lowest</text>
  <rect x="488" y="88" width="442" height="122" rx="10" class="card"/>
  <text x="502" y="114" class="h">CURRENTS</text>
  <text x="502" y="134" class="md">Gulf Stream-North Atlantic Drift warm Europe</text>
  <text x="502" y="151" class="md">Kuroshio warm; Oyashio cold</text>
  <text x="502" y="168" class="md">Peru/Humboldt cold</text>
