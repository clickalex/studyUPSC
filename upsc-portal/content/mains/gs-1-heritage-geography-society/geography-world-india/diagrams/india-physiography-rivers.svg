<?xml version="1.0" encoding="UTF-8"?>
<!-- India — schematic physiography & rivers — studyUPSC -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, system-ui, sans-serif">
  <rect x="1" y="1" width="898" height="638" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">India — Physiography &amp; Rivers (Schematic)</text>
  <text x="450" y="55" text-anchor="middle" font-size="11.5" fill="#94a3b8">schematic teaching aid — not to scale; directions approximate</text>

  <!-- Seas -->
  <rect x="30" y="360" width="180" height="240" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="120" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" transform="rotate(-90 120 470)">ARABIAN SEA</text>

  <rect x="690" y="300" width="180" height="280" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="780" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" transform="rotate(-90 780 440)">BAY OF BENGAL</text>

  <!-- India schematic polygon -->
  <path d="M 300 90 L 380 70 L 470 78 L 540 100 L 590 150 L 640 170 L 660 220 L 640 260 L 600 300 L 585 350 L 560 420 L 520 500 L 460 585 L 430 560 L 400 520 L 365 470 L 330 430 L 295 380 L 265 340 L 250 300 L 235 250 L 250 200 L 270 150 Z"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Himalaya arc -->
  <path d="M 270 130 Q 400 60 600 140" fill="none" stroke="#92400e" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  <text x="420" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">HIMALAYAS (Himadri–Himachal–Shiwalik)</text>

  <!-- Indo-Gangetic plains band -->
  <path d="M 280 155 Q 420 120 610 185" fill="none" stroke="#a78bfa" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
  <text x="440" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6d28d9">Indo-Gangetic-Brahmaputra Plains (khadar/bhangar · bhabar-terai at the foot)</text>

  <!-- Peninsular plateau -->
  <ellipse cx="450" cy="360" rx="165" ry="130" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="450" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">PENINSULAR PLATEAU</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#166534">(Deccan — slopes east; Aravalli = oldest folds, NW)</text>

  <!-- Western Ghats -->
  <path d="M 255 230 L 405 545" stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <text x="290" y="410" font-size="11" font-weight="700" fill="#047857" transform="rotate(-66 290 410)">WESTERN GHATS (Anamudi 2,695 m)</text>

  <!-- Eastern Ghats -->
  <path d="M 640 270 L 540 470" stroke="#059669" stroke-width="4" stroke-dasharray="6 5" opacity="0.75"/>
  <text x="620" y="390" font-size="11" font-weight="700" fill="#047857" transform="rotate(58 620 390)">EASTERN GHATS (discontinuous)</text>

  <!-- Rivers -->
  <g stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Indus -->
    <path d="M 330 70 Q 300 100 270 170 Q 250 220 220 285" />
    <!-- Ganga -->
    <path d="M 360 105 Q 420 130 505 170 Q 545 195 585 215" />
    <!-- Brahmaputra -->
    <path d="M 620 95 Q 660 130 655 175" />
    <!-- Narmada -->
    <path d="M 470 265 Q 410 285 300 300" />
    <!-- Godavari -->
    <path d="M 400 320 Q 480 330 610 340" />
    <!-- Krishna -->
    <path d="M 400 360 Q 500 375 610 390" />
    <!-- Kaveri -->
    <path d="M 390 470 Q 470 480 570 480" />
  </g>
  <!-- Sea mouths markers -->
  <g fill="#2563eb">
    <circle cx="220" cy="285" r="4"/>
    <circle cx="585" cy="215" r="4"/>
    <circle cx="620" cy="210" r="4"/>
    <circle cx="635" cy="235" r="4"/>
    <circle cx="300" cy="300" r="4"/>
    <circle cx="610" cy="340" r="4"/>
    <circle cx="610" cy="390" r="4"/>
    <circle cx="570" cy="480" r="4"/>
  </g>
  <!-- Delta vs estuary tags -->
  <g font-size="10" fill="#1e40af">
    <text x="590" y="205" font-style="italic">Ganga delta → Sundarbans (world's largest)</text>
    <text x="618" y="330" font-style="italic">Godavari delta</text>
    <text x="618" y="382" font-style="italic">Krishna delta</text>
    <text x="578" y="472" font-style="italic">Kaveri delta</text>
    <text x="210" y="308" font-style="italic">Narmada estuary (rift valley)</text>
    <text x="160" y="270" font-style="italic">Indus → Arabian Sea</text>
  </g>

  <!-- Mineral heartland & strip -->
  <text x="455" y="255" font-size="11" font-weight="700" fill="#b45309">★ Chotanagpur — coal/iron ore heartland</text>

  <!-- Islands -->
  <g>
    <text x="105" y="610" font-size="11" font-weight="700" fill="#1d4ed8">Lakshadweep (coral atolls)</text>
    <circle cx="245" cy="604" r="3.5" fill="#1d4ed8"/><circle cx="258" cy="597" r="3.5" fill="#1d4ed8"/><circle cx="270" cy="590" r="3.5" fill="#1d4ed8"/>

    <text x="640" y="610" font-size="11" font-weight="700" fill="#1d4ed8">Andaman &amp; Nicobar — Barren Island (only active volcano); Indira Point = southernmost</text>
    <path d="M 615 560 L 640 520 L 655 555 L 672 512 L 685 545" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Coastal plains tags -->
  <text x="180" y="200" font-size="10.5" fill="#334155">West coast = narrow,</text>
  <text x="180" y="214" font-size="10.5" fill="#334155">estuarine (Konkan–Kanara–Malabar)</text>
  <text x="655" y="255" font-size="10.5" fill="#334155">East coast = wide,</text>
  <text x="655" y="269" font-size="10.5" fill="#334155">deltaic (Utkal–Circars–Coromandel)</text>

  <!-- Footer -->
  <rect x="30" y="600" width="380" height="28" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="50" y="619" font-size="11" fill="#92400e">Golden pattern: <tspan font-weight="700">east-flowing → deltas; west-flowing (Narmada/Tapti) → estuaries</tspan></text>
</svg>
