<?xml version="1.0" encoding="UTF-8"?>
<!-- Major battles & wars of British expansion 1757–1849 — studyUPSC -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Inter, system-ui, sans-serif">
  <rect x="1" y="1" width="898" height="638" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">British Expansion in India — Major Battles &amp; Wars (1757–1849)</text>

  <!-- Column headers -->
  <rect x="30" y="52" width="840" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="73" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">YEAR</text>
  <text x="180" y="73" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">BATTLE / WAR</text>
  <text x="430" y="73" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">FOUGHT AGAINST</text>
  <text x="640" y="73" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">OUTCOME</text>

  <!-- Rows -->
  <g font-size="12.5" fill="#334155">
    <circle cx="60" cy="112" r="4.5" fill="#f59e0b"/>
    <text x="80" y="116" font-weight="700" fill="#92400e">1757</text>
    <text x="180" y="116" font-weight="700" fill="#0f172a">Plassey</text>
    <text x="430" y="116">Siraj-ud-Daula (Nawab of Bengal)</text>
    <text x="640" y="116">Company+Mir Jafar coup → puppet nawab</text>

    <circle cx="60" cy="152" r="4.5" fill="#f59e0b"/>
    <text x="80" y="156" font-weight="700" fill="#92400e">1760</text>
    <text x="180" y="156" font-weight="700" fill="#0f172a">Wandiwash</text>
    <text x="430" y="156">French (Carnatic Wars)</text>
    <text x="640" y="156">French power broken — Treaty of Paris 1763</text>

    <circle cx="60" cy="192" r="6" fill="#ef4444"/>
    <text x="80" y="196" font-weight="700" fill="#b91c1c">1764</text>
    <text x="180" y="196" font-weight="700" fill="#b91c1c">Buxar</text>
    <text x="430" y="196">Mir Qasim + Shuja-ud-Daula + Shah Alam II</text>
    <text x="640" y="196">Diwani of Bengal (Treaty of Allahabad 1765)</text>

    <circle cx="60" cy="232" r="4.5" fill="#f59e0b"/>
    <text x="80" y="236" font-weight="700" fill="#92400e">1767–69</text>
    <text x="180" y="236" font-weight="700" fill="#0f172a">1st Anglo-Mysore War</text>
    <text x="430" y="236">Hyder Ali</text>
    <text x="640" y="236">Treaty of Madras (1769)</text>

    <circle cx="60" cy="272" r="4.5" fill="#f59e0b"/>
    <text x="80" y="276" font-weight="700" fill="#92400e">1780–84</text>
    <text x="180" y="276" font-weight="700" fill="#0f172a">2nd Anglo-Mysore War</text>
    <text x="430" y="276">Hyder Ali → Tipu Sultan (Pollilur 1780)</text>
    <text x="640" y="276">Treaty of Mangalore (1784) — last equal treaty</text>

    <circle cx="60" cy="312" r="4.5" fill="#f59e0b"/>
    <text x="80" y="316" font-weight="700" fill="#92400e">1775–82</text>
    <text x="180" y="316" font-weight="700" fill="#0f172a">1st Anglo-Maratha War</text>
    <text x="430" y="316">Marathas (Raghunath Rao crisis)</text>
    <text x="640" y="316">Treaty of Salbai (1782)</text>

    <circle cx="60" cy="352" r="4.5" fill="#f59e0b"/>
    <text x="80" y="356" font-weight="700" fill="#92400e">1790–92</text>
    <text x="180" y="356" font-weight="700" fill="#0f172a">3rd Anglo-Mysore War</text>
    <text x="430" y="356">Tipu Sultan</text>
    <text x="640" y="356">Treaty of Seringapatam (1792) — ½ territory lost</text>

    <circle cx="60" cy="392" r="6" fill="#ef4444"/>
    <text x="80" y="396" font-weight="700" fill="#b91c1c">1799</text>
    <text x="180" y="396" font-weight="700" fill="#b91c1c">4th Anglo-Mysore War</text>
    <text x="430" y="396">Tipu Sultan</text>
    <text x="640" y="396">Tipu dies at Seringapatam; Wodeyars restored</text>

    <circle cx="60" cy="432" r="4.5" fill="#f59e0b"/>
    <text x="80" y="436" font-weight="700" fill="#92400e">1803–05</text>
    <text x="180" y="436" font-weight="700" fill="#0f172a">2nd Anglo-Maratha War</text>
    <text x="430" y="436">Scindia, Bhonsle (Peshwa in Treaty of Bassein '02)</text>
    <text x="640" y="436">Assaye, Argaon — Wellesley; north of Yamuna ceded</text>

    <circle cx="60" cy="472" r="4.5" fill="#f59e0b"/>
    <text x="80" y="476" font-weight="700" fill="#92400e">1817–19</text>
    <text x="180" y="476" font-weight="700" fill="#0f172a">3rd Anglo-Maratha War</text>
    <text x="430" y="476">Peshwa Baji Rao II + Holkar + Bhonsle</text>
    <text x="640" y="476">Peshwaship abolished (1818); EIC paramount</text>

    <circle cx="60" cy="512" r="4.5" fill="#f59e0b"/>
    <text x="80" y="516" font-weight="700" fill="#92400e">1845–46</text>
    <text x="180" y="516" font-weight="700" fill="#0f172a">1st Anglo-Sikh War</text>
    <text x="430" y="516">Khalsa army (post-Ranjit Singh)</text>
    <text x="640" y="516">Treaty of Lahore (1846); Kashmir → Gulab Singh</text>

    <circle cx="60" cy="552" r="6" fill="#ef4444"/>
    <text x="80" y="556" font-weight="700" fill="#b91c1c">1848–49</text>
    <text x="180" y="556" font-weight="700" fill="#b91c1c">2nd Anglo-Sikh War</text>
    <text x="430" y="556">Khalsa army (Chillianwala → Gujarat 1849)</text>
    <text x="640" y="556">Punjab annexed (1849); Koh-i-Noor to Crown</text>
  </g>

  <!-- footer note -->
  <rect x="30" y="584" width="840" height="36" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="450" y="607" text-anchor="middle" font-size="12.5" fill="#92400e">Red dots = decisive annexation moments: <tspan font-weight="700">Buxar 1764 · Seringapatam 1799 · Gujarat 1849</tspan></text>
</svg>
