<?xml version="1.0" encoding="UTF-8"?>
<!-- Constitutional roadmap 1773–1947 — studyUPSC -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, system-ui, sans-serif">
  <rect x="1" y="1" width="898" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Constitutional Roadmap 1773 → 1947</text>

  <!-- Spine -->
  <line x1="450" y1="56" x2="450" y2="470" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Nodes alternate sides -->
  <!-- 1773 -->
  <circle cx="450" cy="76" r="7" fill="#f59e0b"/>
  <rect x="60" y="56" width="330" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="76" y="74" font-size="12.5" font-weight="700" fill="#0f172a">1773 · Regulating Act</text>
  <text x="76" y="89" font-size="11.5" fill="#334155">Governor-General of Bengal; Supreme Court 1774</text>

  <!-- 1784 -->
  <circle cx="450" cy="118" r="6" fill="#f59e0b"/>
  <rect x="510" y="98" width="330" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="526" y="116" font-size="12.5" font-weight="700" fill="#0f172a">1784 · Pitt's India Act</text>
  <text x="526" y="131" font-size="11.5" fill="#334155">Board of Control; Crown supervises the Company</text>

  <!-- 1813 -->
  <circle cx="450" cy="160" r="6" fill="#f59e0b"/>
  <rect x="60" y="140" width="330" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="158" font-size="12.5" font-weight="700" fill="#0f172a">1813 · Charter Act</text>
  <text x="76" y="173" font-size="11.5" fill="#334155">Trade monopoly ends; ₹1 lakh/yr for education</text>

  <!-- 1833 -->
  <circle cx="450" cy="202" r="6" fill="#f59e0b"/>
  <rect x="510" y="182" width="330" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="526" y="200" font-size="12.5" font-weight="700" fill="#0f172a">1833 · Charter Act</text>
  <text x="526" y="215" font-size="11.5" fill="#334155">First Governor-General of India (Bentinck); Law Commission</text>

  <!-- 1853 -->
  <circle cx="450" cy="244" r="6" fill="#f59e0b"/>
  <rect x="60" y="224" width="330" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="242" font-size="12.5" font-weight="700" fill="#0f172a">1853 · Charter Act</text>
  <text x="76" y="257" font-size="11.5" fill="#334155">Legislative wing separated; open ICS competition</text>

  <!-- 1858 -->
  <circle cx="450" cy="286" r="8" fill="#ef4444"/>
  <rect x="510" y="266" width="330" height="42" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="526" y="284" font-size="12.5" font-weight="700" fill="#b91c1c">1858 · Government of India Act</text>
  <text x="526" y="299" font-size="11.5" fill="#334155">Crown rule — Secretary of State + Viceroy (Canning)</text>

  <!-- 1909 -->
  <circle cx="450" cy="328" r="8" fill="#ef4444"/>
  <rect x="60" y="308" width="330" height="42" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="76" y="326" font-size="12.5" font-weight="700" fill="#b91c1c">1909 · Morley–Minto Reforms</text>
  <text x="76" y="341" font-size="11.5" fill="#334155">Separate electorates for Muslims; first franchise</text>

  <!-- 1919 -->
  <circle cx="450" cy="370" r="8" fill="#ef4444"/>
  <rect x="510" y="350" width="330" height="42" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="526" y="368" font-size="12.5" font-weight="700" fill="#b91c1c">1919 · Montagu–Chelmsford Reforms</text>
  <text x="526" y="383" font-size="11.5" fill="#334155">Dyarchy in provinces; bicameral Central legislature</text>

  <!-- 1935 -->
  <circle cx="450" cy="412" r="8" fill="#ef4444"/>
  <rect x="60" y="392" width="330" height="42" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="76" y="410" font-size="12.5" font-weight="700" fill="#b91c1c">1935 · Government of India Act</text>
  <text x="76" y="425" font-size="11.5" fill="#334155">Provincial autonomy; 3 lists; Federal Court; RBI</text>

  <!-- 1947 -->
  <circle cx="450" cy="454" r="8" fill="#22c55e"/>
  <rect x="510" y="434" width="330" height="42" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="526" y="452" font-size="12.5" font-weight="700" fill="#166534">1947 · Indian Independence Act</text>
  <text x="526" y="467" font-size="11.5" fill="#334155">Two dominions; sovereign Constituent Assemblies</text>

  <!-- Footer -->
  <rect x="30" y="500" width="840" height="40" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="450" y="525" text-anchor="middle" font-size="12.5" fill="#92400e">The 1935 Act is the blueprint the 1950 Constitution inherited: <tspan font-weight="700">federation · Governor · PSCs · three lists</tspan></text>
</svg>
