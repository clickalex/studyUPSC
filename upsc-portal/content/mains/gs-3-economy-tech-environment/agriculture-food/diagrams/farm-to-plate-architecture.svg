<?xml version="1.0" encoding="UTF-8"?>
<!-- India's farm-to-plate policy architecture — studyUPSC -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <rect x="1" y="1" width="898" height="518" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">India's Farm-to-Plate Policy Architecture</text>
  <text x="450" y="55" text-anchor="middle" font-size="11.5" fill="#94a3b8">inputs → production → price &amp; risk support → markets → food security</text>

  <!-- Column headers -->
  <g font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">
    <text x="110" y="86" text-anchor="middle">INPUTS</text>
    <text x="290" y="86" text-anchor="middle">PRODUCTION SUPPORT</text>
    <text x="470" y="86" text-anchor="middle">PRICE &amp; RISK</text>
    <text x="650" y="86" text-anchor="middle">MARKETS</text>
    <text x="800" y="86" text-anchor="middle">PLATE</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="170" y1="200" x2="210" y2="200" marker-end="url(#arr2)"/>
    <line x1="350" y1="200" x2="390" y2="200" marker-end="url(#arr2)"/>
    <line x1="530" y1="200" x2="570" y2="200" marker-end="url(#arr2)"/>
    <line x1="710" y1="200" x2="748" y2="200" marker-end="url(#arr2)"/>
  </g>
  <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>

  <!-- Column cards -->
  <g font-size="10.5">
    <!-- Inputs -->
    <g>
      <rect x="36" y="100" width="134" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="48" y="118" font-weight="700" fill="#0f172a">Water</text>
      <text x="48" y="133" fill="#334155">PMKSY '15 · Atal Bhujal</text>
      <text x="48" y="148" fill="#334155">GW ≈ 89% of irrigation</text>

      <rect x="36" y="170" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="48" y="188" font-weight="700" fill="#0f172a">Inputs &amp; science</text>
      <text x="48" y="203" fill="#334155">HYV · nano-urea · soil cards</text>

      <rect x="36" y="226" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="48" y="244" font-weight="700" fill="#0f172a">Credit</text>
      <text x="48" y="259" fill="#334155">KCC '98 · PM-KISAN ₹6k DBT</text>
    </g>

    <!-- Production -->
    <g>
      <rect x="216" y="100" width="134" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <text x="228" y="118" font-weight="700" fill="#92400e">Crop seasons</text>
      <text x="228" y="133" fill="#334155">Kharif (Jun–Oct) rain</text>
      <text x="228" y="148" fill="#334155">Rabi (Oct–Mar) irrigated</text>

      <rect x="216" y="170" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="228" y="188" font-weight="700" fill="#0f172a">Land reality</text>
      <text x="228" y="203" fill="#334155">~1.08 ha avg · 86% small</text>

      <rect x="216" y="226" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="228" y="244" font-weight="700" fill="#0f172a">Allied sectors</text>
      <text x="228" y="259" fill="#334155">Milk #1 · Fisheries PMMSY</text>
    </g>

    <!-- Price & risk -->
    <g>
      <rect x="396" y="100" width="134" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
      <text x="408" y="118" font-weight="700" fill="#92400e">MSP (23 crops)</text>
      <text x="408" y="133" fill="#334155">CACP → Cabinet</text>
      <text x="408" y="148" fill="#334155">≥ 1.5 × (A2+FL)</text>

      <rect x="396" y="170" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="408" y="188" font-weight="700" fill="#0f172a">Insurance</text>
      <text x="408" y="203" fill="#334155">PMFBY '16 (2/1.5/5%)</text>

      <rect x="396" y="226" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="408" y="244" font-weight="700" fill="#0f172a">Price stabilisation</text>
      <text x="408" y="259" fill="#334155">Buffer stocks · PSF</text>
    </g>

    <!-- Markets -->
    <g>
      <rect x="576" y="100" width="134" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="588" y="118" font-weight="700" fill="#0f172a">Mandis &amp; beyond</text>
      <text x="588" y="133" fill="#334155">APMC ~7,000 · e-NAM '16</text>
      <text x="588" y="148" fill="#334155">FPO 10,000 scheme '20</text>

      <rect x="576" y="170" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="588" y="188" font-weight="700" fill="#0f172a">Storage &amp; processing</text>
      <text x="588" y="203" fill="#334155">Agri Infra Fund ₹1 lakh cr '20</text>

      <rect x="576" y="226" width="134" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="588" y="244" font-weight="700" fill="#0f172a">Procurement</text>
      <text x="588" y="259" fill="#334155">FCI (1965) + state agencies</text>
    </g>

    <!-- Plate -->
    <g>
      <rect x="752" y="100" width="120" height="58" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
      <text x="764" y="118" font-weight="700" fill="#166534">NFSA 2013</text>
      <text x="764" y="133" fill="#334155">75% rural / 50% urban</text>
      <text x="764" y="148" fill="#334155">5 kg/person @ ₹3/2/1</text>

      <rect x="752" y="170" width="120" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="764" y="188" font-weight="700" fill="#0f172a">Distribution</text>
      <text x="764" y="203" fill="#334155">PDS 5.4 lakh FPS · ONORC</text>

      <rect x="752" y="226" width="120" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="764" y="244" font-weight="700" fill="#0f172a">WTO anchor</text>
      <text x="764" y="259" fill="#334155">Bali peace clause (2013)</text>
    </g>
  </g>

  <!-- Under-layer: risk & environment -->
  <rect x="30" y="300" width="840" height="72" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="450" y="324" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">THE STRESSES THE ARCHITECTURE CARRIES</text>
  <g font-size="11.5" fill="#334155">
    <text x="60" y="346">• Groundwater decline (Punjab–Haryana red zone)</text>
    <text x="60" y="362">• Cereal monoculture → stubble burning cycle</text>
    <text x="430" y="346">• Fertilizer subsidy ~₹1 lakh cr + nutrient imbalance (N:P:K)</text>
    <text x="430" y="362">• Climate variability → insurance &amp; strain on PMFBY budgets</text>
  </g>

  <!-- Footer -->
  <rect x="30" y="392" width="840" height="44" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="450" y="412" text-anchor="middle" font-size="12.5" fill="#92400e">New (2024–26): <tspan font-weight="700">Ken–Betwa ILR (Dec '24) · PM Dhan-Dhaanya Krishi Yojana · VB-G RAM G's 60-day agri pause</tspan></text>
  <text x="450" y="429" text-anchor="middle" font-size="12" fill="#92400e">MSP must meet the WTO line — the Bali peace clause is the shield pending a permanent solution</text>
</svg>
