<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgEssay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrEssay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .step{font-size:13px;fill:#0f172a;font-weight:700}
      .md{font-size:11px;fill:#334155}
      .sm{font-size:10px;fill:#64748b}
      .amber{fill:#f59e0b}.green{fill:#22c55e}
      .cl{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrEssay)}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="url(#bgEssay)" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">Essay Architecture — pick 4–5 dimensions, chain the logic, close forward</text>
  <text x="30" y="56" class="s">A dimension chain (choose any 4–5 blocks) · every block follows the same 5-line paragraph rhythm</text>

  <!-- Dimension chips -->
  <g>
    <rect x="40" y="90" width="160" height="56" class="card" rx="10"/>
    <rect x="40" y="90" width="8" height="56" rx="4" class="amber"/>
    <text x="60" y="114" class="step">Social</text>
    <text x="60" y="132" class="sm">family · education · mobility</text>

    <rect x="212" y="90" width="160" height="56" class="card" rx="10"/>
    <rect x="212" y="90" width="8" height="56" rx="4" class="green"/>
    <text x="232" y="114" class="step">Political</text>
    <text x="232" y="132" class="sm">power · voice · federal order</text>

    <rect x="384" y="90" width="160" height="56" class="card" rx="10"/>
    <rect x="384" y="90" width="8" height="56" rx="4" class="amber"/>
    <text x="404" y="114" class="step">Economic</text>
    <text x="404" y="132" class="sm">growth · distribution · markets</text>

    <rect x="556" y="90" width="160" height="56" class="card" rx="10"/>
    <rect x="556" y="90" width="8" height="56" rx="4" class="green"/>
    <text x="576" y="114" class="step">Cultural</text>
    <text x="576" y="132" class="sm">norms · memory · arts</text>

    <rect x="728" y="90" width="192" height="56" class="card" rx="10"/>
    <rect x="728" y="90" width="8" height="56" rx="4" class="amber"/>
    <text x="748" y="114" class="step">Ethical</text>
    <text x="748" y="132" class="sm">right-wrong · conscience · duty</text>
  </g>

  <!-- Second row chips -->
  <g>
    <rect x="40" y="160" width="160" height="56" class="card" rx="10"/>
    <rect x="40" y="160" width="8" height="56" rx="4" class="green"/>
    <text x="60" y="184" class="step">Environmental</text>
    <text x="60" y="202" class="sm">climate · water · biodiversity</text>

    <rect x="212" y="160" width="160" height="56" class="card" rx="10"/>
    <rect x="212" y="160" width="8" height="56" rx="4" class="amber"/>
    <text x="232" y="184" class="step">Technological</text>
    <text x="232" y="202" class="sm">tools · platforms · AI</text>

    <rect x="384" y="160" width="160" height="56" class="card" rx="10"/>
    <rect x="384" y="160" width="8" height="56" rx="4" class="green"/>
    <text x="404" y="184" class="step">Geopolitical</text>
    <text x="404" y="202" class="sm">power order · alliances</text>

    <rect x="556" y="160" width="160" height="56" class="card" rx="10"/>
    <rect x="556" y="160" width="8" height="56" rx="4" class="amber"/>
    <text x="576" y="184" class="step">Gender &amp; Identity</text>
    <text x="576" y="202" class="sm">work · care · voice · dignity</text>

    <rect x="728" y="160" width="192" height="56" class="card" rx="10"/>
    <rect x="728" y="160" width="8" height="56" rx="4" class="green"/>
    <text x="748" y="184" class="step">Historical</text>
    <text x="748" y="202" class="sm">trajectory · precedent · legacy</text>
  </g>

  <!-- Paragraph rhythm card -->
  <rect x="40" y="250" width="480" height="160" class="card" rx="12"/>
  <rect x="40" y="250" width="10" height="160" rx="5" class="amber"/>
  <text x="62" y="278" class="step">The 5-line paragraph rhythm (per dimension)</text>
  <text x="62" y="300" class="md">1. Topic sentence — a claim, not an announcement.</text>
  <text x="62" y="318" class="md">2. Mechanism — how it works, through whom.</text>
  <text x="62" y="336" class="md">3. Evidence vs counter — one dated anchor + fair opposing datum.</text>
  <text x="62" y="354" class="md">4. Mini-case — institution / scheme / judgment / region.</text>
  <text x="62" y="372" class="md">5. Linkage sentence — handoff to the next dimension.</text>
  <text x="62" y="394" class="sm">Guard rails: max 3 numeric anchors per dimension · ~25–40 words per sentence preferance.</text>

  <!-- Flow arrows to conclusion -->
  <line x1="540" y1="330" x2="600" y2="330" class="cl"/>

  <!-- Conclusion block -->
  <rect x="620" y="250" width="300" height="160" class="card" rx="12"/>
  <rect x="620" y="250" width="10" height="160" rx="5" class="green"/>
  <text x="642" y="278" class="step">Close — forward-looking</text>
  <text x="642" y="300" class="md">• Thesis echo (one clause).</text>
  <text x="642" y="318" class="md">• Equilibrium sentence (accept needed tension).</text>
  <text x="642" y="336" class="md">• 1 institutional suggestion (fix agency: law, code, scheme).</text>
  <text x="642" y="354" class="md">• Optional final image (metaphorical return to opening).</text>
  <text x="642" y="382" class="sm">Avoid: new evidence, decision-shifting quotes,</text>
  <text x="642" y="396" class="sm">or "in conclusion" filler transitions.</text>

  <!-- Footer -->
  <rect x="24" y="482" width="912" height="24" rx="6" fill="#f1f5f9"/>
  <text x="40" y="498" class="sm">Discipline bars: 2 quotes max · paragraph blocks 4–6 lines · time split 70-70-20 · word range 1,000–1,200 per essay.</text>
  <text x="880" y="498" class="foot" text-anchor="end">StudyUPSC · Mains Essay</text>
</svg>
