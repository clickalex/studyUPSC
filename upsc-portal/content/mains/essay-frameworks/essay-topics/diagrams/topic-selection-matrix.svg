<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .h{font-size:13.5px;fill:#0f172a;font-weight:700}
      .md{font-size:11.5px;fill:#334155}
      .sm{font-size:10.5px;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .cl{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr)}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">Topic-selection matrix — score before you write</text>
  <text x="30" y="56" class="s">essay-topics · the decision that happens in the first 15 minutes</text>
  <rect x="40" y="84" width="300" height="200" rx="12" class="card"/>
  <text x="60" y="110" class="h">SCORE EACH SHORTLISTED TOPIC 1–5</text>
  <text x="60" y="136" class="md">Familiarity — can I define every term?</text>
  <text x="60" y="160" class="md">Dimension-spread — 4+ lenses available?</text>
  <text x="60" y="184" class="md">Example-supply — 6+ varied instances?</text>
  <text x="60" y="208" class="md">Balance-potential — both sides arguable?</text>
  <text x="60" y="232" class="md">Trap-detector — absolute words handled?</text>
  <text x="60" y="264" class="sm">pick the highest TOTAL — not the highest familiarity</text>
  <rect x="420" y="84" width="240" height="200" rx="12" class="card"/>
  <text x="440" y="110" class="h">FAMILIES ON THE PAPER</text>
  <text x="440" y="134" class="md">Sec 1: philosophical / abstract pairs</text>
  <text x="440" y="154" class="md">Sec 2: tech · economy · environment</text>
  <text x="440" y="174" class="md">gender · polity · culture · rurban</text>
  <text x="440" y="198" class="md">angle generators when blank:</text>
  <text x="440" y="218" class="md">5-lens sweep · time arc · I→G zoom</text>
  <text x="440" y="238" class="md">thesis → antithesis → synthesis</text>
  <text x="440" y="266" class="sm">breadth over expertise — always</text>
  <rect x="740" y="84" width="180" height="200" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="760" y="110" class="h">TIME BOX</text>
  <text x="760" y="134" class="md">read all: 6 min</text>
  <text x="760" y="154" class="md">shortlist 2: 2 min</text>
  <text x="760" y="174" class="md">score + pick: 2 min</text>
  <text x="760" y="194" class="md">blueprint: 5 min</text>
  <text x="760" y="218" class="sm">no switching after</text>
  <text x="760" y="236" class="sm">minute 20 — the</text>
  <text x="760" y="252" class="sm">rewrite never ends</text>
  <path d="M 340 184 L 420 184" class="cl"/><path d="M 660 184 L 740 184" class="cl"/>
  <rect x="40" y="312" width="880" height="56" rx="12" fill="#22c55e" opacity="0.12"/>
  <text x="480" y="334" text-anchor="middle" class="h">BLUEPRINT TEST — would my section titles alone tell a coherent story?</text>
  <text x="480" y="354" text-anchor="middle" class="sm">map example slots first: anecdote · 2 data anchors · 2 schemes · 1 thinker · 1 counter-case</text>
  <text x="30" y="414" class="foot">studyUPSC · essay diagram · pair with short-notes/essay-topics-revision.html</text>
</svg>