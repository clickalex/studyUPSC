<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .h{font-size:14px;fill:#0f172a;font-weight:700}
      .md{font-size:11.5px;fill:#334155}
      .sm{font-size:10.5px;fill:#64748b}
      .cap{fill:#fff;font-size:14px;font-weight:700}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="960" height="460" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">Goleman-5 wheel — EI components mapped to administrative work</text>
  <text x="30" y="56" class="s">GS-4 · emotional intelligence: concepts, utility and application in administration</text>
  <circle cx="480" cy="270" r="118" fill="#f59e0b"/>
  <text x="480" y="262" text-anchor="middle" class="cap">EMOTIONAL</text>
  <text x="480" y="284" text-anchor="middle" class="cap">INTELLIGENCE</text>
  <rect x="60" y="90" width="240" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="180" y="112" text-anchor="middle" class="h">SELF-AWARENESS</text>
  <text x="180" y="130" text-anchor="middle" class="md">know one's state; name it</text>
  <text x="180" y="146" text-anchor="middle" class="sm">→ bias check before orders</text>
  <rect x="660" y="90" width="240" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="780" y="112" text-anchor="middle" class="h">SELF-REGULATION</text>
  <text x="780" y="130" text-anchor="middle" class="md">pause discipline under fire</text>
  <text x="780" y="146" class="sm" text-anchor="middle">→ no impulsive lathi orders</text>
  <rect x="30" y="330" width="240" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="150" y="352" text-anchor="middle" class="h">MOTIVATION</text>
  <text x="150" y="370" text-anchor="middle" class="md">intrinsic drive; purpose</text>
  <text x="150" y="386" text-anchor="middle" class="sm">→ morale in transfers-heavy service</text>
  <rect x="690" y="330" width="240" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="810" y="352" text-anchor="middle" class="h">EMPATHY</text>
  <text x="810" y="370" text-anchor="middle" class="md">perspective-taking</text>
  <text x="810" y="386" text-anchor="middle" class="sm">→ grievance design, negotiation</text>
  <rect x="360" y="392" width="240" height="56" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="412" text-anchor="middle" class="h">SOCIAL SKILL</text>
  <text x="480" y="430" text-anchor="middle" class="sm">influence, teams, de-escalation</text>
  <path d="M 300 125 C 380 160 420 200 448 226" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 660 125 C 580 160 540 200 512 226" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 270 365 C 340 340 400 320 440 300" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 690 365 C 620 340 560 320 520 300" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 480 392 L 480 388" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="30" y="446" class="foot">studyUPSC · GS-4 diagram · ethical bound: EI serves constitutional morality, not popularity</text>
</svg>