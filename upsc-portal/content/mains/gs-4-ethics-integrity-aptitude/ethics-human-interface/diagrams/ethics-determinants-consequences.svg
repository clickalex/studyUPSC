<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .h{font-size:13.5px;fill:#0f172a;font-weight:700}
      .md{font-size:11.5px;fill:#334155}
      .sm{font-size:10.5px;fill:#64748b}
      .cl{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr)}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="960" height="450" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">Determinants → action → consequences: the ethics of a human act</text>
  <text x="30" y="56" class="s">GS-4 · essence, determinants and consequences of ethics in human actions</text>
  <rect x="40" y="90" width="240" height="200" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="116" class="h">DETERMINANTS</text>
  <text x="60" y="140" class="md">Individual — conscience, upbringing,</text>
  <text x="60" y="158" class="md">character, self-interest</text>
  <text x="60" y="184" class="md">Situational — peers, incentives,</text>
  <text x="60" y="202" class="md">hierarchy, ambiguity (Milgram)</text>
  <text x="60" y="228" class="md">Systemic — law, audits, norms,</text>
  <text x="60" y="246" class="md">constitutional morality</text>
  <text x="60" y="272" class="sm">design so integrity is easy, wrong costly</text>
  <rect x="360" y="120" width="230" height="140" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="148" class="h">THE HUMAN ACTION</text>
  <text x="380" y="172" class="md">weighed through lenses:</text>
  <text x="380" y="194" class="md">consequence · duty · virtue</text>
  <text x="380" y="220" class="md">inside law's floor,</text>
  <text x="380" y="238" class="sm">aiming at ethics' optimum</text>
  <rect x="670" y="90" width="250" height="200" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="116" class="h">CONSEQUENCES</text>
  <text x="690" y="140" class="md">Micro — character, trust capital</text>
  <text x="690" y="166" class="md">Meso — institutional reputation,</text>
  <text x="690" y="184" class="md">credibility of every officer</text>
  <text x="690" y="210" class="md">Macro — delivery, social trust,</text>
  <text x="690" y="228" class="md">legitimacy of the State</text>
  <text x="690" y="254" class="sm">asymmetric memory: one unfair order</text>
  <text x="690" y="270" class="sm">outweighs a hundred fair ones</text>
  <path d="M 280 190 L 360 190" class="cl"/>
  <path d="M 590 190 L 670 190" class="cl"/>
  <path d="M 795 290 C 795 360 240 360 160 290" class="cl"/>
  <text x="478" y="372" text-anchor="middle" class="sm">feedback: consequences reshape norms, training and character (moral learning loop)</text>
  <text x="30" y="426" class="foot">studyUPSC · GS-4 diagram · pair with detailed-notes/ethics-human-interface.html</text>
</svg>