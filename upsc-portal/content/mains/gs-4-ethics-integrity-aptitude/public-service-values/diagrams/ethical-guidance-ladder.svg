<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .h{font-size:13.5px;fill:#0f172a;font-weight:700}
      .md{font-size:11.5px;fill:#334155}
      .sm{font-size:10.5px;fill:#64748b}
      .cl{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr)}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="960" height="450" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">Sources of ethical guidance — the officer's resolution ladder</text>
  <text x="30" y="56" class="s">GS-4 · laws, rules, regulations and conscience; ethical reasoning and moral judgment</text>
  <rect x="60" y="90" width="840" height="58" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="114" class="h">1 · LAWS &amp; RULES — certainty, equality, auditability</text>
  <text x="80" y="134" class="sm">default ground: cite the provision, apply to the particular, record reasons</text>
  <rect x="60" y="162" width="840" height="58" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="186" class="h">2 · ADVICE THROUGH HIERARCHY — institutional deliberation</text>
  <text x="80" y="206" class="sm">written noting; committee view; this is where neutrality lives</text>
  <rect x="60" y="234" width="840" height="58" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="258" class="h">3 · CONSTITUTIONAL MORALITY (AMBEDKAR) — the higher discipline</text>
  <text x="80" y="278" class="sm">when social pressure or convenience collides with the Constitution, it loses</text>
  <rect x="60" y="306" width="840" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="330" class="h">4 · CONSCIENCE — the alarm, not the autopilot</text>
  <text x="80" y="350" class="sm">triggers recorded dissent → whistle-blower route → resignation as last resort; never sabotage</text>
  <path d="M 480 148 L 480 162" class="cl"/><path d="M 480 220 L 480 234" class="cl"/><path d="M 480 292 L 480 306" class="cl"/>
  <rect x="60" y="384" width="840" height="44" rx="10" fill="#22c55e" opacity="0.12"/>
  <text x="480" y="402" text-anchor="middle" class="h">ETHICAL TESTS along the way: legality · universalisability · harm · publicity (front-page) · reversibility</text>
  <text x="480" y="420" text-anchor="middle" class="sm">Kohlberg: reason at post-conventional level; write orders in rule-cited language</text>
  <text x="30" y="444" class="foot">studyUPSC · GS-4 diagram · pair with detailed-notes/public-service-values.html</text>
</svg>