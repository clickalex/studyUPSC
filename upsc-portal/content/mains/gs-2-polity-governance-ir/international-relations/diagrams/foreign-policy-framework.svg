<?xml version="1.0" encoding="UTF-8"?>
<!-- India's foreign policy framework — studyUPSC -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Inter, system-ui, sans-serif">
  <rect x="1" y="1" width="898" height="598" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">India's Foreign Policy — Framework &amp; Footprint</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#64748b">Principles (1954–2025) → relationships → multilateral footprint</text>

  <!-- Row 1: doctrine spine -->
  <text x="60" y="92" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DOCTRINE SPINE</text>
  <line x1="60" y1="140" x2="840" y2="140" stroke="#cbd5e1" stroke-width="3"/>
  <g font-size="11.5" fill="#334155">
    <circle cx="120" cy="140" r="6" fill="#f59e0b"/><text x="98" y="168" font-weight="700" fill="#92400e">1954</text><text x="86" y="184">Panchsheel</text>
    <circle cx="220" cy="140" r="6" fill="#f59e0b"/><text x="198" y="168" font-weight="700" fill="#92400e">1961</text><text x="200" y="184">NAM (Belgrade)</text>
    <circle cx="330" cy="140" r="6" fill="#f59e0b"/><text x="308" y="168" font-weight="700" fill="#92400e">1992</text><text x="306" y="184">Look East</text>
    <circle cx="440" cy="140" r="6" fill="#f59e0b"/><text x="418" y="168" font-weight="700" fill="#92400e">2014</text><text x="400" y="184">Neighbourhood First</text>
    <circle cx="550" cy="140" r="6" fill="#f59e0b"/><text x="530" y="168" font-weight="700" fill="#92400e">2015</text><text x="528" y="184">SAGAR</text>
    <circle cx="660" cy="140" r="6" fill="#f59e0b"/><text x="640" y="168" font-weight="700" fill="#92400e">2019</text><text x="622" y="184">Indo-Pacific Oceans</text>
    <circle cx="780" cy="140" r="7" fill="#b91c1c"/><text x="760" y="168" font-weight="700" fill="#b91c1c">2025</text><text x="756" y="184">MAHASAGAR</text>
  </g>

  <!-- Row 2: the great powers -->
  <text x="60" y="228" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">GREAT-POWER TRACKS</text>
  <g font-size="11.5">
    <rect x="30" y="242" width="415" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="262" font-weight="700" fill="#0f172a">USA · nuclear deal (2005–08) · LEMOA/COMCASA/BECA · iCET '23</text>
    <text x="44" y="279" fill="#334155">QUAD partner · largest trade partner · 2025 tariff friction → trade pact talks</text>
    <text x="44" y="296" fill="#334155">Diaspora 5 million+ · defence co-production</text>

    <rect x="455" y="242" width="415" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="469" y="262" font-weight="700" fill="#0f172a">Russia · 1971 treaty · S-400 · top crude supplier post-2022</text>
    <text x="469" y="279" fill="#334155">China · LAC 3,488 km · Galwan 2020 → Kazan thaw Oct '24 · Tianjin '25</text>
    <text x="469" y="296" fill="#334155">Pakistan · Indus Treaty in abeyance (Apr '25) · Operation Sindoor (May '25)</text>
  </g>

  <!-- Row 3: multilateral map -->
  <text x="60" y="352" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">MULTILATERAL FOOTPRINT</text>
  <g font-size="11.5">
    <rect x="30" y="366" width="196" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="44" y="386" font-weight="700" fill="#92400e">UN &amp; UNSC reform</text>
    <text x="44" y="402" fill="#334155">G4 bid · Ezulwini support</text>
    <text x="44" y="418" fill="#334155">8 non-permanent terms</text>

    <rect x="238" y="366" width="196" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="252" y="386" font-weight="700" fill="#92400e">G20 presidency '23</text>
    <text x="252" y="402" fill="#334155">New Delhi Declaration</text>
    <text x="252" y="418" fill="#334155">AU joined · IMEC · GBA</text>

    <rect x="446" y="366" width="196" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="460" y="386" font-weight="700" fill="#92400e">BRICS &amp; SCO</text>
    <text x="460" y="402" fill="#334155">BRICS expanded 2024</text>
    <text x="460" y="418" fill="#334155">India chairs BRICS 2026</text>

    <rect x="654" y="366" width="216" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="668" y="386" font-weight="700" fill="#92400e">QUAD · I2U2 · IORA</text>
    <text x="668" y="402" fill="#334155">Leader-level since 2021</text>
    <text x="668" y="418" fill="#334155">Colombo Security Conclave</text>

    <rect x="30" y="444" width="196" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="464" font-weight="700" fill="#0f172a">BIMSTEC '97</text>
    <text x="44" y="480" fill="#334155">Bay-of-Bengal growth route</text>

    <rect x="238" y="444" width="196" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="252" y="464" font-weight="700" fill="#0f172a">ISA '15 · CDRI '19</text>
    <text x="252" y="480" fill="#334155">Climate &amp; resilient infra</text>

    <rect x="446" y="444" width="196" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="460" y="464" font-weight="700" fill="#0f172a">WTO · NDB · AIIB</text>
    <text x="460" y="480" fill="#334155">Development-finance voice</text>

    <rect x="654" y="444" width="216" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="668" y="464" font-weight="700" fill="#0f172a">Diaspora ~35 million</text>
    <text x="668" y="480" fill="#334155">Remittances $120 bn+ · PBD Jan 9</text>
  </g>

  <!-- Footer -->
  <rect x="30" y="528" width="840" height="48" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="450" y="549" text-anchor="middle" font-size="12.5" fill="#b91c1c">Strategic autonomy = <tspan font-weight="700">multi-alignment without alliances</tspan> — QUAD + SCO + BRICS simultaneously</text>
  <text x="450" y="567" text-anchor="middle" font-size="12" fill="#b91c1c">Current pivot (2024–26): China thaw, Pakistan abeyance-era, US trade negotiation, India chairs BRICS 2026</text>
</svg>
