<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .h{font-size:13px;fill:#0f172a;font-weight:700}
      .md{font-size:11px;fill:#334155}
      .sm{font-size:10.5px;fill:#64748b}
      .sec{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .q{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
      .g{fill:#22c55e;opacity:.12;stroke:#22c55e;stroke-width:1.5}
      .cl{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr)}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">The essay practice loop — twelve weeks, four skills, one notebook</text>
  <text x="30" y="56" class="s">essay-practice · select → blueprint → write → polish → learn (repeat weekly)</text>
  <rect x="40" y="84" width="170" height="80" rx="10" class="sec"/>
  <text x="125" y="108" text-anchor="middle" class="h">SELECT (4 min)</text>
  <text x="125" y="126" text-anchor="middle" class="sm">score all prompts:</text>
  <text x="125" y="142" text-anchor="middle" class="sm">familiarity × dimensions</text>
  <text x="125" y="158" text-anchor="middle" class="sm">× examples → pick total</text>
  <rect x="230" y="84" width="170" height="80" rx="10" class="sec"/>
  <text x="315" y="108" text-anchor="middle" class="h">BLUEPRINT (5 min)</text>
  <text x="315" y="126" text-anchor="middle" class="sm">thesis + 5-7 signposts</text>
  <text x="315" y="142" text-anchor="middle" class="sm">6 example slots</text>
  <text x="315" y="158" text-anchor="middle" class="sm">incl. counter-view</text>
  <rect x="420" y="84" width="170" height="80" rx="10" class="g"/>
  <text x="505" y="108" text-anchor="middle" class="h">WRITE (150 min)</text>
  <text x="505" y="126" text-anchor="middle" class="sm">checkpoints at 80/140</text>
  <text x="505" y="142" text-anchor="middle" class="sm">dimensions signposted;</text>
  <text x="505" y="158" text-anchor="middle" class="sm">thesis ends each section</text>
  <rect x="610" y="84" width="150" height="80" rx="10" class="sec"/>
  <text x="685" y="108" text-anchor="middle" class="h">POLISH (15 min)</text>
  <text x="685" y="126" text-anchor="middle" class="sm">title · underline keywords</text>
  <text x="685" y="142" text-anchor="middle" class="sm">margins clean</text>
  <text x="685" y="158" text-anchor="middle" class="sm">no new arguments</text>
  <rect x="780" y="84" width="140" height="80" rx="10" class="q"/>
  <text x="850" y="108" text-anchor="middle" class="h">LEARN</text>
  <text x="850" y="126" text-anchor="middle" class="sm">self-grade /125</text>
  <text x="850" y="142" text-anchor="middle" class="sm">rewrite worst section</text>
  <text x="850" y="158" text-anchor="middle" class="sm">notebook refill</text>
  <path d="M 210 124 L 230 124" class="cl"/><path d="M 400 124 L 420 124" class="cl"/>
  <path d="M 590 124 L 610 124" class="cl"/><path d="M 760 124 L 780 124" class="cl"/>
  <path d="M 850 164 C 850 210 125 210 125 164" class="cl"/>
  <rect x="40" y="222" width="430" height="160" rx="10" class="sec"/>
  <text x="56" y="246" class="h">TWELVE-WEEK ARC</text>
  <text x="56" y="268" class="md">Wk 1-4 ARCHITECTURE — outline sprints ×3 + 1 essay + model study</text>
  <text x="56" y="286" class="md">Wk 5-8 DIMENSIONS — 5-lens sweeps · counter-view essay · example audit</text>
  <text x="56" y="304" class="md">Wk 9-11 EXECUTION — clocked full essays · 10-second skim test · rewrites</text>
  <text x="56" y="322" class="md">Wk 12 CALIBRATION — 2 mocks, band-graded by peer/mentor</text>
  <text x="56" y="348" class="sm">all seven prompt families ×2 essays before exam; longhand stamina weekly</text>
  <rect x="490" y="222" width="430" height="160" rx="10" class="sec"/>
  <text x="506" y="246" class="h">THE NOTEBOOK (6 species × 2 entries weekly)</text>
  <text x="506" y="268" class="md">legal/constitutional anchors · schemes with mechanism</text>
  <text x="506" y="286" class="md">honest approximate data · thinkers with quotes</text>
  <text x="506" y="304" class="md">historical cases · lived observations</text>
  <text x="506" y="328" class="md">each entry = one linked sentence ("X, because…, shows…")</text>
  <text x="506" y="352" class="sm">feedback: peer 10-sec skim · mentor one-suggestion read · next-morning rewrite</text>
  <text x="30" y="420" class="foot">studyUPSC · essay practice diagram · pair with detailed-notes/essay-practice-system.html</text>
</svg>