<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-size:20px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#64748b}
      .h{font-size:13px;fill:#0f172a;font-weight:700}
      .md{font-size:11px;fill:#334155}
      .sm{font-size:10.5px;fill:#64748b}
      .p1{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .p2{fill:#fffbeb;stroke:#f59e0b;stroke-width:1.5}
      .g{fill:#22c55e;opacity:.12;stroke:#22c55e;stroke-width:1.5}
      .cl{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arr)}
      .foot{font-size:10px;fill:#94a3b8}
    </style>
  </defs>
  <rect width="960" height="450" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="30" y="36" class="t">Anthropology optional — the science lane feeding the India lane</text>
  <text x="30" y="56" class="s">paper 1 builds concepts and methods; paper 2 deploys them on caste, tribe and nation</text>
  <rect x="40" y="80" width="420" height="230" rx="12" class="p1"/>
  <text x="56" y="104" class="h">PAPER 1 — THE SCIENCE</text>
  <text x="56" y="128" class="md">Foundations: branches · relation to sociology/biology · applied</text>
  <text x="56" y="148" class="md">Evolution: primates → hominids → Homo sapiens (fossils)</text>
  <text x="56" y="168" class="md">Society: marriage · family · kinship · economy · polity · religion</text>
  <text x="56" y="188" class="md">Theories: evolutionism · diffusion · functionalism (Malinowski)</text>
  <text x="56" y="206" class="md">structural-function (R-B) · structuralism (L-S) · culture-personality</text>
  <text x="56" y="228" class="md">Methods: fieldwork · participant observation · genealogy</text>
  <text x="56" y="248" class="md">Genetics: Mendel · populations · twin studies · applications</text>
  <text x="56" y="284" class="sm">style: define first · diagram every answer · ethnographic example</text>
  <rect x="520" y="80" width="400" height="230" rx="12" class="p2"/>
  <text x="536" y="104" class="h">PAPER 2 — INDIAN ANTHROPOLOGY</text>
  <text x="536" y="128" class="md">Prehistoric cultures → Harappan interface</text>
  <text x="536" y="148" class="md">Peoples: linguistic · religious · racial elements; ST/SC demography</text>
  <text x="536" y="168" class="md">Caste system + change · village India · tribal situation</text>
  <text x="536" y="188" class="md">Economy (jajmani debate) · movements · syncretism</text>
  <text x="536" y="208" class="md">Tribe-nation: land alienation · displacement · PVTGs</text>
  <text x="536" y="226" class="md">Safeguards: 5th/6th Schedules · Art. 342 · PESA · FRA 2006</text>
  <text x="536" y="246" class="md">Paradigms: isolation → assimilation → integration → participation</text>
  <text x="536" y="284" class="sm">style: named community + scheme + datum per unit (case notebook ×12)</text>
  <path d="M 460 195 L 520 195" class="cl"/>
  <text x="490" y="182" text-anchor="middle" class="sm">feeds</text>
  <rect x="40" y="330" width="880" height="70" rx="12" class="g"/>
  <text x="60" y="354" class="h">TWELVE-WEEK FIRST PASS</text>
  <text x="60" y="374" class="md">wk 1-3 evolution/physical · wk 4-6 kinship &amp; society · wk 7-8 theories · wk 9-11 paper-2 + case notebook · wk 12 methods + PYQ mapping</text>
  <text x="60" y="392" class="sm">fit: science-comfort + memory discipline · watch: tribal current-affairs weekly</text>
  <text x="30" y="432" class="foot">studyUPSC · anthropology optional diagram · pair with detailed-notes/anthropology-syllabus-map.html</text>
</svg>